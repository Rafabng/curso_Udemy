<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magalu</title>
    <style>

        body{
            margin: 0;
        }
        a{
            border: 2px solid white;
            background-color: lightblue;
            color: dodgerblue;
            margin: 8px;
            padding: 6px;
            border-radius: 5px;
        }

        #produtos{
            width: 1000px;
            margin: 10px auto;
        }

        #titulo{
            padding: 10px;
            background-color: dodgerblue;
        }

        #area_banner{
            background-color: purple;

        }

        #banner{
            width: 1000px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div id="titulo">
        <img src="img/logo-magalu.png" alt="Magalu" width="200">
        <a href="">Ofertas do dia</a>
        <a href="">Celulares</a>
        <a href="">Eletrodomésticos</a>
        <a href="">TV e Vídeo</a>
        <a href="">Informática</a>
    </div>

    <div id="area_banner">
        <div id="banner">
            <img src="img/banner.png" alt="banner">
        </div>
    </div>

    <div id="produtos">

        <h1>Produtos</h1>

        <img src="img/produto1.jpg" alt="produto1">
        <img src="img/produto2.jpg" alt="produto2">
        <img src="img/produto3.jpg" alt="produto3">
        <img src="img/produto4.jpg" alt="produto4">
    </div>

    <div style="background-color: dodgerblue; font-weight: bold;">
        <span style="color: darkslateblue;">Magazine Luiza</span>
        <span style="color: white;">todos os direitos reservados</span>

    </div>
    
</body>
</html>

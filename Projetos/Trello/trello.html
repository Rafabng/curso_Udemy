<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE-Edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Interface de login do Trello</title>
    <!--
        <script src="https://unpkg.com/@codans/trello"></script>
    -->
    </head>
    <body>
        <img src="img/trello.svg" width="200" alt="Logo Trello"><br>

        <h1>Fazer login no Trello</h1>

        <form action="" method="get">
            <input type="text" name="email" placeholder="Insira o e-mail"><br>
            <input type="password" name="senha" placeholder="Insira a senha"><br>
            <input type="submit" value="Fazer Login"><br><br>

            <span>Ou</span><br><br>

            <button>
                <img src="img/google.svg" width="20" alt="Google">
                Continuar com o Google
            </button><br><br>

            <button>
                <img src="img/microsoft.svg" width="20" alt="Microsoft">
                Continuar com a Microsoft
            </button><br><br>

            <button>
                <img src="img/apple.svg" width="20" alt="Apple">
                Continuar com a Apple
            </button><br><br>

            <button>
                <img src="img/slack.svg" width="20" alt="Slack">
                Continuar com o Slack
            </button><br><br>
        </form>
        <img src="img/atlassian.svg" width="200" alt="Atlassian">
        <img src="img/analytics.svg" width="200" alt="Analytics">
        <img src="img/interactive.svg" width="200" alt="Interactive">
    </body>
</html>
